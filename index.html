    excerpt: "Los monjes piden escuchar el Dhamma. El Bienaventurado va a la ermita del brahmán Rammaka.",
    text: `<p>Esto he escuchado: En una ocasión, el Bienaventurado estaba morando en la Arboleda de Jeta del Parque de Anathapindika, cerca de Savatthi.</p>
<p>Entonces, de mañana temprano, el Bienaventurado se vistió y, tomando su hábito exterior y el cuenco, entró a Savatthi en busca de la comida de las limosnas. Al mismo tiempo, un grupo de monjes se fue junto al Venerable Ananda y le dijeron: "Amigo Ananda, hace mucho tiempo que no hemos escuchado una plática del Dhamma de labios del Bienaventurado."</p>
<p>"Entonces, que los venerables señores vayan a la ermita del brahmán Rammaka. Quizá estando allí, podréis escuchar una plática del Dhamma de labios del Bienaventurado."</p>
<p>Entonces, el Bienaventurado fue a la ermita del brahmán Rammaka. Un grupo de monjes estaba sentado allí, discutiendo sobre el Dhamma. Y el Bienaventurado se paró afuera, frente a la puerta principal, esperando hasta que terminasen su discusión. Cuando supo que la misma había terminado, tosió y golpeó la puerta.</p>`,
    x: 0.08, y: 0.13,

  {
    id: 2,
    title: "Dos\nBúsquedas",
    excerpt: "Monjes, existen dos clases de búsqueda: la noble y la innoble. Esta es la distinción central del sutta.",
    text: `<p>Entonces, el Bienaventurado habló diciendo: "Monjes, existen dos clases de búsqueda: la búsqueda noble y la búsqueda innoble."</p>
<p>Este es el eje central de la enseñanza del sutta: toda actividad humana puede ser comprendida bajo una de estas dos categorías. La búsqueda innoble persigue aquello que inevitablemente perece. La búsqueda noble orienta la vida hacia lo que trasciende el sufrimiento.</p>
<p>Esta distinción no es meramente filosófica — es una pregunta que el Buda dirige directamente a cada uno de nosotros: ¿Cuál de estas dos búsquedas ocupa verdaderamente nuestra vida?</p>`,
    x: 0.25, y: 0.08,
    connects: [1, 3, 4],
    key: true
  },
  {
    id: 3,
    title: "Búsqueda\nInnoble",
    excerpt: "Alguien sujeto al nacimiento busca lo que también está sujeto al nacimiento: mujer, hijos, oro, plata...",
    text: `<p>"¿Qué es la búsqueda innoble? He aquí, alguien, siendo él mismo sujeto al nacimiento, busca aquello que también está sujeto al nacimiento; siendo él mismo sujeto a la vejez, la enfermedad, la muerte y la pena, busca aquello que también está sujeto a la vejez, la enfermedad y la muerte."</p>
<p>"¿Y qué está sujeto al nacimiento, la vejez, la enfermedad, la muerte, la pena y las impurezas? La mujer y los hijos, esclavos y esclavas, las cabras y las ovejas, las aves y los cerdos, los elefantes, el ganado, los caballos, las yeguas, el oro y la plata están sujetos a estas cosas."</p>
<p>"Estas adquisiciones están todas sujetas, y alguien que está atado a estas cosas, encaprichado con ellas y totalmente entregado a ellas, es alguien que, siendo él mismo sujeto al nacimiento, la vejez, la enfermedad, la muerte, la pena y las impurezas — busca aquello que también está sujeto a estas cosas."</p>`,

    connects: [2, 4, 15]
  },
  {
    id: 4,
    title: "Búsqueda\nNoble",
    excerpt: "Alguien que comprende el peligro de lo nacido busca lo no-nacido: la suprema liberación, el Nibbana.",
    text: `<p>"¿Qué es la noble búsqueda? He aquí, alguien, siendo él mismo sujeto al nacimiento, habiendo comprendido el peligro de lo que está sujeto al nacimiento, busca lo no-nacido, la suprema liberación de las ataduras de la esclavitud, el Nibbana."</p>
<p>"Siendo él mismo sujeto a la vejez, la enfermedad, la muerte, la pena y las impurezas — habiendo comprendido el peligro de lo que está sujeto a eso — busca la no-vejez, lo no-enfermo, lo inmortal, el sosiego, lo puro, la suprema liberación de las ataduras de la esclavitud, el Nibbana."</p>
<p>"Ésta es, monjes, la noble búsqueda."</p>`,
    x: 0.62, y: 0.07,

  },
  {
    id: 5,
    title: "Abandono\ndel Hogar",
    excerpt: "Siendo joven, con cabello negro, aunque mis padres lloraron, afeité mi cabeza y salí para la vida sin hogar.",
    text: `<p>"Monjes, antes de mi Despertar, siendo yo mismo sujeto al nacimiento, estaba buscando aquello que también estaba sujeto al nacimiento... Entonces, consideré esto: '¿Por qué, siendo yo mismo sujeto a estas cosas, estoy buscando aquello que también estaba sujeto a estas cosas?'"</p>
<p>"Más tarde, cuando era joven, un hombre de cabello negro, dotado de la bendición de la juventud, en la primicia de la vida — aunque mi madre y padre desearon otra cosa y derramaron lágrimas — afeité mi cabeza y la barba, me puse el hábito amarillo y salí de la casa para una vida sin hogar."</p>
<p>"Habiendo renunciado, monjes, en busca de lo que es saludable, buscando el estado supremo de la paz sublime, fui junto a Alara Kalama..."</p>`,
    x: 0.70, y: 0.23,

  {
    id: 6,
    title: "Ālāra\nKālāma",
    excerpt: "Pronto alcancé ese Dhamma. Pero no conducía al Nibbana, solo a la base de la nada. Me marché.",
    text: `<p>"Fui junto a Alara Kalama y pronto aprendí aquel Dhamma, alcanzándolo por mí mismo con la Visión Clara directa."</p>
<p>"Alara Kalama me dijo: 'Así como soy yo, eres tú; y como eres tú, soy yo. Ven, amigo, dirijamos esta comunidad juntos.' De esta manera, me puso en el mismo nivel que él y me otorgó el honor más elevado."</p>
<p>"Pero se me ocurrió esto: 'Este Dhamma no conduce al desencanto, al desapasionamiento, al cese, a la paz, a la Visión Clara directa, al Despertar, al Nibbana — sino solo a la reaparición en la base de la nada'."</p>
<p>"No estando satisfecho con ese Dhamma, decepcionado, me marché."</p>`,
    x: 0.65, y: 0.38,
    connects: [5, 7]
  },
  {
    id: 7,
    title: "Uddaka\nRāmaputta",
    excerpt: "También ese Dhamma no conducía al Nibbana, sino a la base de ni-percepción-ni-no percepción. Me marché.",
    text: `<p>"Siguiendo con la búsqueda de lo que es saludable, fui junto a Uddaka Ramaputta y pronto entré y permanecí en ese Dhamma."</p>
<p>"Uddaka Ramaputta me puso en la posición de un maestro y me concedió el honor más elevado."</p>
<p>"Pero se me ocurrió esto: 'Este Dhamma no lleva al desencanto, al desapasionamiento, al cese, a la paz, a la Visión Clara directa, al Despertar, al Nibbana — sino solo a la reaparición en la base de ni-percepción-ni-no percepción'."</p>
<p>"No estando satisfecho con ese Dhamma, decepcionado, me marché."</p>`,

  },
  {
    id: 8,
    title: "Uruvela\nEl Despertar",
    excerpt: "Llegué a Uruvela, un bosque encantador con un río de aguas claras. Allí alcancé el Nibbana.",
    text: `<p>"Recorrí por partes el país de Magadha, hasta que finalmente llegué a Uruvela, en Senanigama. Allí vi un terreno agradable, un bosque encantador con un río de aguas claras con agradables y suaves riberas..."</p>
<p>"Entonces, monjes, siendo yo mismo sujeto al nacimiento, habiendo comprendido el peligro de lo que está sujeto al nacimiento, buscando lo no-nacido — <em>alcancé lo no-nacido, la suprema liberación de las ataduras de la esclavitud, el Nibbana.</em>"</p>
<p>"Y surgió en mí este conocimiento y visión: 'Mi liberación es inamovible; este es mi último nacimiento; he aquí, no hay futura renovación de la existencia'."</p>`,
    x: 0.58, y: 0.67,

    key: true
  },
  {
    id: 9,
    title: "La Duda",
    excerpt: "Este Dhamma es profundo, difícil de ver. Si enseñara y no me entendieran, sería una fatiga para mí.",
    text: `<p>"Entonces, consideré esto: 'Este Dhamma alcanzado por mí es profundo, difícil de ver, difícil de entender, apacible, excelso, que trasciende la dialéctica, sutil, inteligible para aprender.'"</p>
<p>"'Sin embargo, esta generación se deleita en los placeres sensuales... y para una generación que se deleita en los placeres sensuales, sería un asunto muy difícil el ver la verdad, o sea, la condicionalidad y el surgimiento dependiente.'"</p>
<p>"'De modo que, si yo enseñara este Dhamma a otros y ellos no me entendieran, esto podría llegar a ser una fatiga para mí, podría llegar a ser una vejación para mí.'"</p>
<p>"Considerando esto, mi mente se inclinó más bien hacia la inactividad y no hacia la enseñanza del Dhamma."</p>`,
    x: 0.42, y: 0.73,
    connects: [8, 10]
  },
  {
    id: 10,
    title: "Brahma\nSahampati",
    excerpt: "¡Ay, el mundo está perdido! Que el Bienaventurado enseñe. Hay seres con poco polvo en sus ojos.",
    text: `<p>"Al Brahma Sahampati, al haber conocido esta forma de razonar, se le ocurrió: '¡Ay, el mundo está perdido! ¡Ay, el mundo está destruido en la medida que la mente del Tathagata se inclina hacia la inactividad!'"</p>
<p>"'Venerable señor, que el Bienaventurado enseñe el Dhamma... He aquí, hay seres con poco polvo en sus ojos, quienes, al no escuchar el Dhamma, están decayendo, pero si a ellos se les enseñara el Dhamma, acrecentarían su imperfecto conocimiento.'"</p>
<p><em>Abre esta puerta a lo inmortal y hazles escuchar<br>
el Dhamma que es sin mancha y conduce al Despertar.<br>
Como un hombre que estuviera parado en la cima de una montaña,<br>
pudiendo observar la gente abajo aunque estuviera muy lejos...<br><br>
¡Levántate, héroe! ¡Conquistador de la batalla!<br>
Que el Bienaventurado enseñe el Dhamma.</em></p>`,
    x: 0.27, y: 0.63,
    connects: [9, 11]
  },
  {
    id: 11,
    title: "El Estanque\nde Lotos",
    excerpt: "Como lotos sumergidos, en la superficie o emergidos del agua — así vi a los seres del mundo.",
    text: `<p>"Habiendo entendido la súplica del Brahma, a causa de la compasión hacia los seres, inspeccioné el mundo con la vista de un Despierto."</p>
<p>"Al igual que en un estanque de agua de lotos — pocos son los lotos que, al nacer en el agua y al crecer en el agua, no emergen del agua y, sin embargo, florecen mientras estén completamente sumergidos; y pocos son también los que alcanzan la superficie del agua; y pocos son también los que se levantan emergiendo del agua, purificados por el agua."</p>
<p>"De la misma manera, he visto a los seres con poco polvo en sus ojos, he visto a los seres con mucho polvo en sus ojos, seres con facultades perspicaces y seres con facultades adormecidas, seres dóciles y seres indómitos."</p>
<p><em>Abiertas están, para aquellos que escuchen, las puertas de lo inmortal.<br>
Aquellos que tengan oídos, dejadles oír.</em></p>`,

  {
    id: 12,
    title: "Los Cinco\nMonjes",
    excerpt: "Con el ojo divino visualicé a los cinco monjes en Isipatana, en el Parque de los Venados, en Benarés.",
    text: `<p>"'¿A quién podría enseñar el Dhamma primero? ¿Quién podrá entender este Dhamma rápidamente?'"</p>
<p>"'Alara Kalama es instruido, experimentado, sabio...' Pero unos devas me anunciaron: 'Venerable señor, Alara Kalama ha muerto hace siete días.'"</p>
<p>"'Uddaka Ramaputta es instruido, experimentado, sabio...' Pero unos devas me anunciaron: 'Venerable señor, Uddaka Ramaputta murió anoche.'"</p>
<p>"Entonces, consideré: 'Para aquel grupo de cinco monjes que me han esperado cuando resolví esforzarme, esto sería muy útil.' Con el ojo divino, purificado y que sobrepasa el humano, visualicé el grupo de los cinco monjes morando cerca de Benarés, en Isipatana, en el Parque de los Venados."</p>`,

    connects: [11, 13]
  },
  {
    id: 13,
    title: "Encuentro\nen el Camino",
    excerpt: "Upaka me vio: 'Tus órganos sensoriales son puros.' — Soy el maestro supremo, el completamente Iluminado.",
    text: `<p>"En esta ocasión, mientras caminaba a lo largo de la ruta que va desde Gaya al Árbol de la Iluminación, me vio el Ajivaka Upaka en el camino: 'Amigo, tus órganos sensoriales son realmente puros, tu tez, brillante y muy clara. ¿Quién es tu maestro?'"</p>
<p><em>Yo soy el que ha trascendido a todos. Soy inmaculado entre todas las cosas del mundo,<br>
liberado por el fin del deseo. He llegado a este estado por mis propios esfuerzos.<br>
No tengo maestro, y no hay otro ser como yo en todo el mundo.<br>
Yo soy el maestro supremo, el completamente Iluminado.<br>
En un mundo que se ha quedado ciego, voy a batir el tambor de los Inmortales.</em></p>
<p>"Con esto Upaka dijo: 'Que así sea, mi amigo', y, sacudiendo la cabeza, se fue."</p>`,

// Map
const NM = {};
NODES.forEach(n => NM[n.id] = n);

// Unique edges
function edges() {
  const seen = new Set();
  const out = [];
  NODES.forEach(n => {
    n.connects.forEach(c => {
      const k = [Math.min(n.id,c), Math.max(n.id,c)].join('-');
      if (!seen.has(k)) { seen.add(k); out.push([n.id, c]); }
    });
  });
  return out;
}

const isMobile = () => window.innerWidth <= 600;
// Clamp canvas size so nodes don't collapse on small screens
const CW = () => Math.max(window.innerWidth,  isMobile() ? 420 : window.innerWidth);
const CH = () => Math.max(window.innerHeight, isMobile() ? 950 : window.innerHeight);
const px = n => ({ x: n.x * CW(), y: n.y * CH() });

// Set canvas element dimensions explicitly
const canvasEl = document.getElementById('canvas');
const svg = document.getElementById('svg-lines');

function sizeCanvas() {
  canvasEl.style.width  = CW() + 'px';
  canvasEl.style.height = CH() + 'px';
}
sizeCanvas();

// Hint text
const hintEl = document.getElementById('hint');
function updateHint() {
  hintEl.textContent = isMobile()
    ? 'toca un nodo para leer'
    : 'hover para ver un extracto · clic para leer';
}
updateHint();

// Build DOM nodes
const NEL = {};

NODES.forEach(n => {
  const wrap = document.createElement('div');
  wrap.className = 'node' + (n.key ? ' key' : '');
  wrap.dataset.id = n.id;

  const ring = document.createElement('div');
  ring.className = 'node-ring';
  ring.innerHTML = n.title.replace('\n', '<br>');
  wrap.appendChild(ring);
  canvasEl.appendChild(wrap);
  NEL[n.id] = wrap;

  const { x, y } = px(n);
  wrap.style.left = x + 'px';
  wrap.style.top  = y + 'px';

  // Mouse events (desktop)
  wrap.addEventListener('mouseenter', e => { if (!isMobile()) hoverOn(n, e); });
  wrap.addEventListener('mouseleave', ()  => { if (!isMobile()) hoverOff(); });
  wrap.addEventListener('mousemove',  e  => { if (!isMobile()) moveTooltip(e); });

  // Click / tap
  wrap.addEventListener('click', () => openNode(n));
});

// SVG lines
function drawEdges(hl = []) {
  svg.innerHTML = '';
  svg.setAttribute('width',  CW());
  svg.setAttribute('height', CH());

  edges().forEach(([a, b]) => {
    const pa = px(NM[a]), pb = px(NM[b]);
    const lit = hl.includes(a) && hl.includes(b);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', pa.x); line.setAttribute('y1', pa.y);
    line.setAttribute('x2', pb.x); line.setAttribute('y2', pb.y);
    line.setAttribute('stroke', lit ? 'rgba(210,155,50,0.55)' : 'rgba(130,80,20,0.18)');
    line.setAttribute('stroke-width', lit ? '1.5' : '0.8');
    svg.appendChild(line);
  });
}
drawEdges();

// Tooltip (desktop only)
const tt = document.getElementById('tooltip');
let mx = 0, my = 0;

function moveTooltip(e) {
  mx = e.clientX; my = e.clientY;
  postt();
}
function postt() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = 270, h = tt.offsetHeight || 90;
  let x = mx + 16, y = my - 12;
  if (x + w > vw - 16) x = mx - w - 16;
  if (y + h > vh - 16) y = vh - h - 16;
  tt.style.left = x + 'px';
  tt.style.top  = y + 'px';
}

function hoverOn(n, e) {
  if (activeId === n.id) return;
  document.getElementById('tt-title').textContent = n.title.replace('\n',' ');
  document.getElementById('tt-body').textContent  = n.excerpt;
  tt.classList.add('show');

  const ids = [n.id, ...n.connects];
  drawEdges(ids);
  NODES.forEach(nd => {
    NEL[nd.id].classList.remove('highlighted','dimmed');
    if (ids.includes(nd.id)) NEL[nd.id].classList.add('highlighted');
    else NEL[nd.id].classList.add('dimmed');
  });
}

function hoverOff() {
  tt.classList.remove('show');
  NODES.forEach(nd => NEL[nd.id].classList.remove('highlighted','dimmed'));
  if (activeId) drawEdges([activeId, ...NM[activeId].connects]);
  else drawEdges();
}

// Panel + backdrop
const panel   = document.getElementById('panel');
const panelX  = document.getElementById('panel-x');
const backdrop = document.getElementById('backdrop');
let activeId = null;

panelX.addEventListener('click', closePanel);
backdrop.addEventListener('click', closePanel);

// Swipe-down to close on mobile
let touchStartY = 0;
panel.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
panel.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (dy > 60) closePanel();
}, { passive: true });

function closePanel() {
  panel.classList.remove('open');
  backdrop.classList.remove('show');
  if (activeId) NEL[activeId].classList.remove('active');
  activeId = null;
  drawEdges();
}

function openNode(n) {
  if (activeId !== null) NEL[activeId].classList.remove('active');
  activeId = n.id;
  NEL[n.id].classList.add('active');

  document.getElementById('p-num').textContent   = `nodo ${n.id} de ${NODES.length}`;
  document.getElementById('p-title').textContent = n.title.replace('\n',' ');
  document.getElementById('p-body').innerHTML    = n.text;

  const linksEl = document.getElementById('p-links');
  linksEl.innerHTML = '';
  n.connects.forEach(cid => {
    const cn = NM[cid];
    const sp = document.createElement('span');
    sp.className = 'p-link';
    sp.textContent = cn.title.replace('\n',' ');
    sp.addEventListener('click', () => openNode(cn));
    linksEl.appendChild(sp);
  });

  panel.classList.add('open');
  backdrop.classList.add('show');
  panel.scrollTop = 0;
  drawEdges([n.id, ...n.connects]);
}

// Resize / orientation change
function onResize() {
  sizeCanvas();
  updateHint();
  NODES.forEach(n => {
    const { x, y } = px(n);
    NEL[n.id].style.left = x + 'px';
    NEL[n.id].style.top  = y + 'px';
  });
  drawEdges(activeId ? [activeId, ...NM[activeId].connects] : []);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 150));

// Ambient pulse
let t = 0;
(function pulse() {
  t += 0.007;
  NODES.forEach((n, i) => {
    const el = NEL[n.id];
    if (el.classList.contains('active') || el.classList.contains('highlighted')) return;
    const ring = el.querySelector('.node-ring');
    const glow = 6 + Math.sin(t + i * 0.65) * 3;
    ring.style.boxShadow = `0 0 ${glow}px rgba(170,110,25,0.10)`;
  });
  requestAnimationFrame(pulse);
})();
</script>
</body>
